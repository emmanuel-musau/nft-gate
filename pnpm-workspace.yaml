packages:
  - "packages/*"
  - "examples/*"
  # Not JS packages — they join the workspace so `pnpm test`/`lint`/`build` reach
  # the Aiken validators instead of silently skipping the sole enforcement layer.
  - "onchain"
  - "examples/demo-vault/onchain"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
